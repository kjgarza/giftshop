name: Generate Instagram Campaign

on:
  schedule:
    - cron: "0 12 * * 0"
  workflow_dispatch:
    inputs:
      date:
        description: "Optional execution date in YYYY-MM-DD format"
        required: false
        type: string
      holiday_id:
        description: "Optional holiday id override"
        required: false
        type: string

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Generate campaign manifest
        id: generate
        working-directory: apps/gift-shop
        env:
          INPUT_DATE: ${{ inputs.date }}
          INPUT_HOLIDAY_ID: ${{ inputs.holiday_id }}
        run: |
          args=()
          if [ -n "$INPUT_DATE" ]; then
            args+=(--date "$INPUT_DATE")
          fi
          if [ -n "$INPUT_HOLIDAY_ID" ]; then
            args+=(--holiday-id "$INPUT_HOLIDAY_ID")
          fi
          bun run generate:instagram "${args[@]}"

      - name: Upload campaign manifest
        if: steps.generate.outputs.campaign_created == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: instagram-campaign-${{ github.run_id }}
          path: ${{ steps.generate.outputs.manifest_path }}
